services:
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs
    ports:
      - '3000:3000'
    command: >
      sh -c "
        npx prisma migrate deploy --schema=src/prisma/schema.prisma &&
        npx prisma db seed &&
        node dist/main
      "
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s