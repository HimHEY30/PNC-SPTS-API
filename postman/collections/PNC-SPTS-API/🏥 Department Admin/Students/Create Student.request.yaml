$kind: http-request
description: |-
  **Role Access:** ADMIN ✅ | SUPER_ADMIN ✅ | TEACHER ❌ | STUDENT ❌

  Create a new user. Requires SUPER_ADMIN or ADMIN role with user.create permission. Valid roles are SUPER_ADMIN, ADMIN, TEACHER, STUDENT, STAFF. Submit as multipart/form-data; provide either an `image` file or `profileImageUrl`.
url: "{{baseUrl}}/users"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: first_name
      value: John
    - type: text
      key: last_name
      value: Doe
    - type: text
      key: email
      value: john.doe@example.com
    - type: text
      key: password
      value: Password@123
    - type: text
      key: phone
      value: "+85512345678"
    - type: text
      key: role
      value: STUDENT
    - type: text
      key: profileImageUrl
      value: https://example.com/avatar.jpg
      description: Optional remote image URL. Ignored if an image file is uploaded.
    - type: file
      key: image
      src: C:/Users/LOQ/Pictures/12345fdf7fbe1697b8f3b891fc247c36 (1).jpg
      description: Optional profile image file (JPEG/PNG/WEBP/GIF, max 5MB). Takes
        priority over profileImageUrl.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () {
        pm.response.to.have.status(201);
      });

      pm.test('Response envelope is valid', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('statusCode', 201);
        pm.expect(json).to.have.property('success', true);
        pm.expect(json).to.have.property('data');
        pm.expect(json).to.have.property('timestamp');
      });

      pm.test('Created user has required fields', function () {
        const data = pm.response.json().data;
        pm.expect(data).to.have.property('id');
        pm.expect(data).to.have.property('first_name');
        pm.expect(data).to.have.property('last_name');
        pm.expect(data).to.have.property('email');
      });

      pm.test('Created user does not expose password', function () {
        const data = pm.response.json().data;
        pm.expect(data).to.not.have.property('password');
        pm.expect(data).to.not.have.property('password_hash');
      });

      pm.test('Response time is under 3000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(3000);
      });

      // Save created user ID for subsequent requests
      if (pm.response.code === 201) {
        const data = pm.response.json().data;
        if (data && data.id) {
          pm.collectionVariables.set('userId', data.id);
        }
      }
    language: text/javascript
order: 1000
