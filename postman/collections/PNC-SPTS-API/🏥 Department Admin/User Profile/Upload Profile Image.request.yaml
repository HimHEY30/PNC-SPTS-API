$kind: http-request
name: Upload Profile Image
method: POST
url: '{{baseUrl}}/users/profile/image'
description: |-
  **Role Access:** ADMIN ✅ | SUPER_ADMIN ✅ | TEACHER ✅ | STUDENT ✅

  Upload the currently authenticated user's profile image. Multipart/form-data with a required `image` file (JPEG/PNG/WEBP/GIF, max 5MB). Returns the stored image URL.
order: 4126630146157266
body:
  type: formdata
  content:
    - key: image
      type: file
      src: ''
      description: 'Profile image file (JPEG/PNG/WEBP/GIF, max 5MB). Required.'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', function () {
        pm.response.to.have.status(201);
      });

      pm.test('Response contains image url', function () {
        const json = pm.response.json();
        const data = json.data || json;
        pm.expect(data).to.have.property('url');
      });

      pm.test('Response time is under 3000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(3000);
      });
