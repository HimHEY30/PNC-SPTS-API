$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email": "{{superadmin_email}}", "password": "{{superadmin_password}}"}'
scripts:
  - type: afterResponse
    code: |-
      // ✅ Success Case Tests
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success true", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response contains access_token", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('access_token');
          pm.expect(json.data.access_token).to.be.a('string').and.not.empty;
      });

      pm.test("Response contains refresh_token", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('refresh_token');
          pm.expect(json.data.refresh_token).to.be.a('string').and.not.empty;
      });

      pm.test("Response contains expires_in", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('expires_in');
          pm.expect(json.data.expires_in).to.equal(900);
      });

      // 💾 Save tokens to collection variables
      const json = pm.response.json();
      if (json.success && json.data) {
          pm.collectionVariables.set('access_token', json.data.access_token);
          pm.collectionVariables.set('refresh_token', json.data.refresh_token);
          console.log('✅ Tokens saved to collection variables');
      }
    language: text/javascript
order: 1000
