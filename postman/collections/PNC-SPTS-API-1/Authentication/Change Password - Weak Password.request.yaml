$kind: http-request
description: "Generated from cURL: curl -X POST {{base_url}}/auth/change-password -H \"Content-Type: application/json\" -H \"Authorization: Bearer {{access_token}}\" -d '{\"currentPassword\": \"Password123!\", \"newPassword\": \"weak\"}'"
url: "{{base_url}}/api/auth/change-password"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: '{"currentPassword": "Password123!", "newPassword": "weak"}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Validation error for weak password", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 10000
