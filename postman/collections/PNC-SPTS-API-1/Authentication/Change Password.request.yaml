$kind: http-request
description: "Generated from cURL: curl -X POST {{base_url}}/auth/change-password -H \"Content-Type: application/json\" -H \"Authorization: Bearer {{access_token}}\" -d '{\"currentPassword\": \"Password123!\", \"newPassword\": \"NewPassword123!\"}'"
url: "{{base_url}}/api/auth/change-password"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: '{"currentPassword": "Password123!", "newPassword": "NewPassword123!"}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test("Response is successful", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });
    language: text/javascript
order: 9000
