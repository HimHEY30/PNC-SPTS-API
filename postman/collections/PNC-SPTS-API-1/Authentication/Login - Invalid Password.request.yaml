$kind: http-request
description: "Generated from cURL: curl -X POST {{base_url}}/auth/login -H \"Content-Type: application/json\" -d '{\"email\": \"superadmin@example.com\", \"password\": \"WrongPassword123!\"}'"
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email": "{{superadmin_email}}", "password": "WrongPassword123!"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Response has success false", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });
      pm.test("Error message present", function () {
          const json = pm.response.json();
          pm.expect(json.message).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 2000
