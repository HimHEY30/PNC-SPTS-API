$kind: http-request
description: "Generated from cURL: curl -X POST {{base_url}}/auth/refresh -H \"Content-Type: application/json\" -d '{\"refresh_token\": \"invalid.token.here\"}'"
url: "{{base_url}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"refresh_token": "invalid_token"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Error response", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 6000
