$kind: http-request
description: "Generated from cURL: curl -X POST {{base_url}}/auth/reset-password -H \"Content-Type: application/json\" -d '{\"token\": \"{{reset_token}}\", \"newPassword\": \"NewPassword123!\"}'"
url: "{{base_url}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"token": "{{reset_token}}", "newPassword": "NewPassword123!","email":"{{superadmin_email}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 201 or 400", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 400]);
      });
    language: text/javascript
order: 8000
