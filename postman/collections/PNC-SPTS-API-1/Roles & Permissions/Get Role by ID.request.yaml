$kind: http-request
description: 'Generated from cURL: curl -X GET {{base_url}}/roles/{{test_role_id}} -H "Authorization: Bearer {{access_token}}"'
url: "{{base_url}}/api/roles/{{test_role_id}}"
method: GET
headers:
  Authorization: Bearer {{access_token}}
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Role data returned", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data).to.be.an('object');
      });
    language: text/javascript
order: 8000
