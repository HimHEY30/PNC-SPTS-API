$kind: http-request
description: "Generated from cURL: curl -X POST {{base_url}}/roles -H \"Content-Type: application/json\" -H \"Authorization: Bearer {{access_token}}\" -d '{\"name\": \"invalid-role-name\", \"description\": \"Should fail validation\"}'"
url: "{{base_url}}/api/roles"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: '{"name": "invalid role name!", "description": "Invalid"}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Validation error for invalid name format", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 6000
