$kind: http-request
description: 'Generated from cURL: curl -X GET {{base_url}}/roles -H "Authorization: Bearer {{access_token}}"'
url: "{{base_url}}/api/roles"
method: GET
headers:
  Authorization: Bearer {{access_token}}
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is successful", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });
      pm.test("Data is an array", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.be.an('array');
      });
      // Save first role ID
      const json = pm.response.json();
      if (json.success && json.data && json.data.length > 0) {
          pm.collectionVariables.set('test_role_id', json.data[0].id || json.data[0].role_id);
          console.log('✅ Saved test_role_id: ' + pm.collectionVariables.get('test_role_id'));
      }
    language: text/javascript
order: 9000
