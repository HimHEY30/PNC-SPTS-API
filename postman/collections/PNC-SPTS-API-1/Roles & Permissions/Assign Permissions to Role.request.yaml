description: "Generated from cURL: curl -X POST {{base_url}}/roles/{{test_role_id}}/permissions -H \"Content-Type: application/json\" -H \"Authorization: Bearer {{access_token}}\" -d '{\"permissions\": [\"student.read\", \"student.update\", \"followup.read\"]}'"
