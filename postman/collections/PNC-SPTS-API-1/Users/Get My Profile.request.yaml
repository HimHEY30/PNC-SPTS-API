$kind: http-request
description: 'Generated from cURL: curl -X GET {{base_url}}/users/profile -H "Authorization: Bearer {{access_token}}"'
url: "{{base_url}}/api/users/profile"
method: GET
headers:
  Authorization: Bearer {{access_token}}
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has user data", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data).to.be.an('object');
      });
      pm.test("Profile has email field", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('email');
      });
      // Save current user ID
      const json = pm.response.json();
      if (json.success && json.data && json.data.user_id) {
          pm.collectionVariables.set('current_user_id', json.data.user_id);
      }
    language: text/javascript
order: 14000
