$kind: http-request
description: "Generated from cURL: curl -X PATCH {{base_url}}/users/{{test_user_id}}/role -H \"Content-Type: application/json\" -H \"Authorization: Bearer {{access_token}}\" -d '{\"role\": \"TUTOR\"}'"
url: "{{base_url}}/api/users"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: '{"email": "newuser@example.com", "password": "Password123!", "first_name": "New", "last_name": "User", "role": "tutor"}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Role assigned successfully", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });
    language: text/javascript
order: 3000
