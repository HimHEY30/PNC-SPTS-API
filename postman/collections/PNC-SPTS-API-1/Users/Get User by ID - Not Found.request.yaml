$kind: http-request
description: 'Generated from cURL: curl -X GET {{base_url}}/users/nonexistent-id-00000 -H "Authorization: Bearer {{access_token}}"'
url: "{{base_url}}/api/users/{{test_user_id}}/status"
method: PATCH
headers:
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: '{"status": "inactive"}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Not found error", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 10000
