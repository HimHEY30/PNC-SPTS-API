$kind: http-request
description: "Generated from cURL: curl -X PATCH {{base_url}}/users/{{test_user_id}} -H \"Content-Type: application/json\" -H \"Authorization: Bearer {{access_token}}\" -d '{\"first_name\": \"Updated\", \"last_name\": \"Name\"}'"
url: "{{base_url}}/api/users/{{test_user_id}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: '{ "first_name": "Updated", "last_name": "User", "phone": "+1234567890" }'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("User updated successfully", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });
    language: text/javascript
