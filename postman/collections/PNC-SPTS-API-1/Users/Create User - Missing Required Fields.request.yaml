$kind: http-request
description: "Generated from cURL: curl -X POST {{base_url}}/users -H \"Content-Type: application/json\" -H \"Authorization: Bearer {{access_token}}\" -d '{\"first_name\": \"Test\"}'"
url: "{{base_url}}/api/users/{{test_user_id}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: '{"first_name": "Updated", "last_name": "Name"}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Validation error", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });
    language: text/javascript
order: 8000
